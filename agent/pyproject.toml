[project]
name = "vigil-agent"
version = "0.1.0"
description = "Claude Agent SDK diagnostic layer for vigil — reasons over system snapshots, suggests optimizations"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.2.131",
]

[project.scripts]
vigil-agent = "vigil_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigil_agent"]

[dependency-groups]
dev = ["pytest>=8"]
