[package]
name = "vigil"
version = "0.1.0"
edition = "2021"
description = "Lightweight macOS system metrics collector — feeds snapshots to an LLM agent for diagnosis"
license = "MIT"

[dependencies]
sysinfo = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
