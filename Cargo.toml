[package]
name = "vigil"
version = "0.1.0"
edition = "2021"
description = "Lightweight macOS system metrics collector — feeds snapshots to an LLM agent for diagnosis"
license = "MIT"

[dependencies]
sysinfo = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
tray-icon = "0.24.2"
tao = "0.36.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

# For `samply`/flamegraph-style profiling (see README's "Profiling" section).
# The real `--release` profile above strips symbols and optimizes for size,
# which is right for what actually ships (see AGENTS.md's governing design
# goal) but useless for a flamegraph -- addresses with no function names.
# `cargo build --profile profiling` keeps release-level optimization plus
# real symbols, without touching the default release build at all.
[profile.profiling]
inherits = "release"
strip = false
debug = true
